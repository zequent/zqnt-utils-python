[project]
name = "zqnt-utils"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "zqnt-api",
    "redis[asyncio]>=8.1.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=9.1.1",
    "grpcio-tools>=1.60.0",
    "mypy-protobuf>=5.1.0",
]

[tool.uv.sources]
zqnt-api = { git = "https://github.com/zequent/zqnt-api-python", rev = "89b611a0ba4a99b7182d6e439a95c233f8784991" }  # zqnt-api 3.0.0 preview (#6, v3 detection radar geometry); the release tag once it is cut

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zqnt_utils"]

[tool.ruff]
exclude = ["zqnt_utils/generated/**"]

[tool.ruff.lint]
ignore = ["E402"]
