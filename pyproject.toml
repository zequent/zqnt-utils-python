[project]
name = "zqnt-utils"
version = "3.0.0"
requires-python = ">=3.12"
dependencies = [
    "zqnt-api",
    "redis[asyncio]>=8.0.0",
    "grpcio>=1.60.0",
    "protobuf>=4.25.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.15",
    "pytest>=9.0.3",
    "grpcio-tools>=1.60.0",
    "mypy-protobuf>=3.5.0",
]

[tool.uv.sources]
zqnt-api = { git = "https://github.com/zequent/zqnt-api-python", tag = "pr-3-0afa431" }  # zqnt-api 3.0.0 preview; the release tag once it is cut

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zqnt_utils"]

[tool.ruff]
exclude = ["zqnt_utils/generated/**"]

[tool.ruff.lint]
ignore = ["E402"]
