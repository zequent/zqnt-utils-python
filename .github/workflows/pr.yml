name: PR – Lint, Test, Build Preview

on:
  pull_request:
    branches: [main, feature/v3-agentic]

permissions:
  contents: read

jobs:
  ci:
    name: Lint · Test · Build Preview
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # ── Python ────────────────────────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # ── uv ────────────────────────────────────────────────────────────────
      - name: Install uv
        uses: astral-sh/setup-uv@6dfebec6ddbcd197e02256fbdf54deb334fb7f06 # v2.1.2

      # ── Dependencies ───────────────────────────────────────────────────────
      - name: Install dependencies
        run: uv sync

      # ── Lint ───────────────────────────────────────────────────────────────
      - name: Lint (ruff)
        run: uv run ruff check .

      # ── Format Check ───────────────────────────────────────────────────────
      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q

      - name: Preview version
        id: version
        run: |
          VERSION=$(grep "^version" pyproject.toml | cut -d'"' -f2)
          PR_VERSION="${VERSION}+pr${{ github.event.pull_request.number }}.$(git rev-parse --short HEAD)"
          sed -i "s/^version = \".*\"/version = \"${PR_VERSION}\"/" pyproject.toml
          echo "pr_version=${PR_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Preview version: ${PR_VERSION}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: uv build

  pr-preview:
    name: Tag PR preview build
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Compute preview tag
        id: tag
        run: |
          TAG="pr-${{ github.event.pull_request.number }}-$(git rev-parse --short=7 HEAD)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Preview tag: ${TAG}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The checkout keeps no credentials; the push authenticates in this step only.
      - name: Create and push preview tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.tag.outputs.tag }}"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${{ steps.tag.outputs.tag }}"
